spring:
datasource:
url: jdbc:h2:mem:treino;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
driver-class-name: org.h2.Driver
username: sa
password:
jpa:
hibernate:
ddl-auto: update
properties:
hibernate.format_sql: true
hibernate.jdbc.time_zone: UTC
open-in-view: false
jackson:
property-naming-strategy: LOWER_CAMEL_CASE


